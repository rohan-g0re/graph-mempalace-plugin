name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: plugin validate (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # `claude plugin validate` is offline and needs no login: it reads the
      # manifests, skills and hooks from disk and makes no API call. Verified
      # locally 2026-10-10 on Claude Code 2.1.273. (--json exists on some CLI
      # versions and not others, so CI relies on the exit code.) --strict turns warnings into
      # failures, which is the point -- an unknown manifest key otherwise loads
      # silently and does nothing.
      - name: Validate plugin
        run: claude plugin validate . --strict

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        run: python -m pip install pytest

      # The suite is offline: fake tools on a temporary PATH, a temporary HOME.
      # It never touches a real palace, graph or config.
      - name: Run tests
        run: python -m pytest -q
